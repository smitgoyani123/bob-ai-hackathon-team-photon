submission:
  title: "GridGuard AI"                # REQUIRED — Project display name

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Power grid transmission and distribution operators have no predictive signal for electrical equipment failure.
    Transformers, automated switches, and high-voltage lines fail unpredictably under compound thermal, overload,
    and monsoon storm stress, forcing reactive and suboptimal emergency crew dispatches that prolong cascading blackouts.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    GridGuard AI is an autonomous power grid failure prediction, consequence risk assessment, and crew pre-positioning platform.
    It combines a 21-feature Random Forest ML failure model with multi-dimensional weather risk and grid impact engines,
    providing zero-hallucination deterministic explanations and automated skill-matched crew pre-positioning via Haversine distance before blackouts occur.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Random Forest ML failure prediction model with 21 engineered feature vectors and class balancing"
    - "Multi-signal Weather Risk (0-100) and Grid Consequence Impact (0-100) scoring engines"
    - "Zero-hallucination deterministic explainability engine evaluating 16 engineering threshold rules per asset"
    - "Automated skill-matched crew pre-positioning using spherical Haversine geodesic distance"
    - "Enterprise React 19 Leaflet GIS Command Center with live RainViewer Doppler radar and interactive What-If scenario simulator"

  tech_stack:
    languages:
      - "Python"
      - "TypeScript"
      - "SQL"
      - "CSS3"
    frameworks:
      - "React 19"
      - "FastAPI"
      - "Vite"
      - "Leaflet"
      - "Recharts"
    ibm_technologies:
      - "IBM Bob (AI Software Engineering Partner for architecture design, vector math optimization, and diagnostics)"
    databases: []
    other:
      - "scikit-learn"
      - "pandas"
      - "NumPy"
      - "joblib"
      - "geopy"
      - "GitHub Actions"

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The end-to-end integration speed and operational rigor: taking raw grid telemetry and weather data,
    running full ML inference and risk formulation, evaluating 16 deterministic audit reasons, and pre-positioning
    skill-matched crews in under 2 seconds, visualized across a real-world Leaflet GIS satellite and Doppler radar command center.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The ML model is calibrated on a synthetic 30-equipment, 10-weather zone benchmark matching realistic utility distributions.
    Pre-positioning distance uses geodesic Haversine distance rather than real-time road topology routing, and the prototype runs
    on local ports (5173 and 8000) for security and offline demonstration.

